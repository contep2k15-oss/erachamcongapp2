<style>
  :root{
    --primary:#1B5FE0; --primaryDark:#123F9E; --teal:#0FB8A6;
    --bg:#F3F5F9; --card:#FFFFFF; --ink:#16213E; --sub:#6B7690;
    --line:#E7EAF1; --amber:#F2A03D; --red:#E5484D; --green:#1FAE72;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; background:#0b0e14; height:100%; overscroll-behavior:none; }
  body{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
    touch-action:manipulation;
  }
  input,textarea{
    -webkit-user-select:text; user-select:text;
    -webkit-touch-callout:default;
  }
  input,select,textarea,button{ font-family:inherit; font-size:14px; }

  .app{
    position:fixed; top:0; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:430px;
    display:flex; flex-direction:column; background:var(--bg); overflow:hidden;
  }
  .header{
    background:linear-gradient(135deg,var(--primary),var(--primaryDark));
    color:#fff; padding: calc(14px + env(safe-area-inset-top)) 18px 16px;
    flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
  }
  .header .title{ font-size:17px; font-weight:700; }
  .content{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
  .pad{ padding: 14px 16px 20px; }

  .nav{
    display:flex; border-top:1px solid var(--line); background:var(--card);
    padding: 8px 4px calc(env(safe-area-inset-bottom,8px) + 8px); flex-shrink:0;
    position:relative;
  }
  .nav button{
    flex:1; background:none; border:none; padding:6px 0; color:var(--sub);
    font-size:10.5px; font-weight:500; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:3px;
  }
  .nav button svg{ width:21px; height:21px; }
  .nav button.active{ color:var(--primary); font-weight:700; }
  .qa-item{ display:flex; align-items:center; gap:12px; padding:14px 4px; border-bottom:1px solid var(--line); cursor:pointer; }
  .settings-section-label{
    font-size:11.5px; font-weight:700; color:var(--sub); text-transform:uppercase;
    letter-spacing:0.4px; margin:18px 4px 8px;
  }
  .settings-section-label:first-of-type{ margin-top:14px; }
  .qa-item:last-child{ border-bottom:none; }
  .qa-icon{ width:38px; height:38px; border-radius:10px; background:#EEF1F7; color:var(--primary); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .qa-icon svg{ width:19px; height:19px; }

  .screen{ display:none; }
  .screen.active{ display:block; }

  .card{ background:var(--card); border-radius:16px; padding:16px; box-shadow:0 6px 18px rgba(20,40,90,0.06); margin-bottom:12px; }
  .btn{ border:none; border-radius:12px; padding:12px 0; font-weight:700; font-size:14px; cursor:pointer; width:100%; }
  .btn-primary{ background:var(--primary); color:#fff; }
  .btn-outline{ background:#EEF1F7; color:var(--ink); }
  .btn-green{ background:#E7F8F0; color:var(--green); }
  .btn-red{ background:#FBEAEA; color:var(--red); }
  .input{ width:100%; border:1.5px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:10px; font-size:16px; }
  .input.pinfield{ -webkit-text-security:disc; text-security:disc; letter-spacing:2px; }

  /* Bàn phím PIN tự vẽ - không mở bàn phím hệ thống, tránh mọi thanh gợi ý autofill */
  .pin-display{ display:flex; gap:10px; justify-content:center; margin:6px 0 16px; }
  .pin-dot{ width:14px; height:14px; border-radius:50%; border:2px solid var(--line); box-sizing:border-box; transition:background .1s,border-color .1s; }
  .pin-dot.filled{ background:var(--primary); border-color:var(--primary); }
  .pin-keypad{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px; }
  .pin-key{ background:#EEF1F7; border:none; border-radius:12px; padding:14px 0; font-size:19px; font-weight:700; color:var(--ink); cursor:pointer; }
  .pin-key:active{ background:#DCE3F0; }
  .pin-key.pin-key-empty{ background:transparent; pointer-events:none; }
  .pin-key.pin-key-del{ font-size:16px; }
  .num-display{ font-size:22px; font-weight:800; color:var(--ink); text-align:center; min-height:30px; margin:6px 0 10px; }

  /* Dropdown tự vẽ - thay thế <select> để không mở popup hệ điều hành */
  .custom-select{ position:relative; margin-bottom:10px; }
  .custom-select-btn{ width:100%; text-align:left; display:flex; justify-content:space-between; align-items:center; cursor:pointer; background:var(--card); }
  .custom-select-list{ display:none; position:absolute; top:calc(100% + 4px); left:0; right:0; background:var(--card); border:1.5px solid var(--line); border-radius:10px; max-height:220px; overflow-y:auto; z-index:60; box-shadow:0 10px 24px rgba(20,40,90,0.18); }
  .custom-select-list.show{ display:block; }
  .custom-select-item{ padding:11px 14px; font-size:14px; cursor:pointer; border-bottom:1px solid var(--line); }
  .custom-select-item:last-child{ border-bottom:none; }
  .custom-select-item:active{ background:#EEF1F7; }
  .custom-date-row{ display:flex; gap:8px; margin-bottom:10px; }
  .custom-date-row .custom-select{ flex:1; margin-bottom:0; }
  .row{ display:flex; gap:8px; }
  .pill{ display:inline-block; font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:999px; }
  .sub{ color:var(--sub); font-size:12.5px; }
  .list-item{ display:flex; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid var(--line); }
  .list-item:last-child{ border-bottom:none; }
  .avatar{ width:38px; height:38px; border-radius:50%; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; flex-shrink:0; }
  .tabs{ display:flex; gap:8px; overflow-x:auto; padding-bottom:10px; }
  .tabs button{ flex-shrink:0; padding:7px 14px; border-radius:999px; font-size:12.5px; font-weight:600; border:none; background:var(--card); color:var(--sub); }
  .tabs button.active{ background:var(--primary); color:#fff; }

  .overlay{ position:fixed; inset:0; background:rgba(20,30,60,0.45); display:none; align-items:flex-end; z-index:100; }
  .overlay.show{ display:flex; }
  .sheet{ background:var(--card); width:100%; max-width:430px; margin:0 auto; border-radius:20px 20px 0 0; padding: 18px 18px calc(env(safe-area-inset-bottom,18px) + 18px); max-height:85vh; overflow-y:auto; }
  .sheet-title{ font-weight:700; font-size:15px; margin-bottom:14px; }

  .empty{ text-align:center; color:var(--sub); font-size:13px; padding:24px 0; }
  .toast{ position:fixed; left:50%; bottom:90px; transform:translateX(-50%); background:#16213E; color:#fff; padding:10px 16px; border-radius:10px; font-size:13px; z-index:200; opacity:0; transition:opacity .25s; pointer-events:none; max-width:80%; text-align:center; }
  .toast.show{ opacity:1; }
</style>
</head>

<script>
"use strict";

// =====================================================================
// KHOÁ HÀNH VI TRÌNH DUYỆT - để app cảm giác độc lập, không lộ là web
// =====================================================================
// Chặn menu chuột phải / nhấn giữ (trừ trong ô nhập liệu, vẫn cần copy/paste)
document.addEventListener("contextmenu", (e) => {
  const tag = e.target.tagName;
  if (tag !== "INPUT" && tag !== "TEXTAREA") e.preventDefault();
});
// Chặn bôi đen văn bản ngoài ô nhập liệu (tránh hiện popup "Tìm trên Google/Chia sẻ")
document.addEventListener("selectstart", (e) => {
  const tag = e.target.tagName;
  if (tag !== "INPUT" && tag !== "TEXTAREA") e.preventDefault();
});
// Chặn phóng to bằng cử chỉ 2 ngón (Safari iOS)
document.addEventListener("gesturestart", (e) => e.preventDefault());
document.addEventListener("gesturechange", (e) => e.preventDefault());
// Chặn double-tap zoom dự phòng (ngoài touch-action:manipulation trong CSS)
let lastTouchEnd = 0;
document.addEventListener("touchend", (e) => {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });

// =====================================================================
// RĂN ĐE SAO CHÉP (KHÔNG PHẢI BẢO MẬT THẬT)
// Lưu ý: đây chỉ là biện pháp ngăn người dùng thông thường tò mò, KHÔNG
// ngăn được người rành kỹ thuật (họ vẫn xem được mã nguồn bằng nhiều
// cách khác). Bảo mật DỮ LIỆU thật sự nằm ở lớp session token phía dưới.
// =====================================================================
console.log("%c⚠ Dừng lại!", "color:#E5484D;font-size:26px;font-weight:800;");
console.log("%cĐây là công cụ dành cho lập trình viên. Không dán bất kỳ đoạn mã nào vào đây theo hướng dẫn của người lạ - có thể bị chiếm quyền tài khoản/dữ liệu công ty.", "font-size:14px;");
document.addEventListener("keydown", (e) => {
  const k = e.key ? e.key.toLowerCase() : "";
  const blockCombo =
    k === "f12" ||
    (e.ctrlKey && k === "u") ||
    (e.ctrlKey && e.shiftKey && (k === "i" || k === "j" || k === "c"));
  if (blockCombo) e.preventDefault();
});

// =====================================================================
// CONFIG — SỬA 2 DÒNG NÀY THEO APPS SCRIPT CỦA BẠN
// =====================================================================
const API_URL   = "https://script.google.com/macros/s/AKfycbzkx15FDlrxOcqRj7RCm0sLdMAKBDjyiYWkK4kA5zXj2iTtzSiHMMgACaHEp5E9QDYv4w/exec";
const APP_TOKEN = "CONTEP2K20";
const APP_VERSION = "20260808-28";

const STORAGE_KEY = "cc_state_v1";
const SESSION_KEY = "cc_session_v1";

// =====================================================================
// STATE
// =====================================================================
let state = loadLocal() || {
  employees: [], records: [], leaveRequests: [], correctionRequests: [], auditLog: [], announcements: [],
  shifts: [{ id: "CA1", tenCa: "Ca hành chính", gioBatDau: "08:00", gioKetThuc: "17:30", updatedAt: 0, deleted: false }],
  config: { gioChuan: "08:00", gioRaChuan: "17:30", soPhutChoPhepTre: 10, batBuocGPS: false, banKinhGPS: 300, viTriCongTy: { lat: null, lng: null }, updatedAt: 0 },
};
// Đảm bảo dữ liệu cũ (state đã lưu từ trước, chưa có trường mới) không bị lỗi
if (!state.correctionRequests) state.correctionRequests = [];
if (!state.auditLog) state.auditLog = [];
if (!state.announcements) state.announcements = [];
let session = JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); // {employeeId}
let currentTab = "checkin";
let syncTimer = null;
let syncing = false;

function loadLocal() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (e) { return null; }
}
function saveLocal() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}
function genId(prefix) {
  return prefix + "-" + Date.now() + "-" + Math.random().toString(36).slice(2, 7);
}

// =====================================================================
// TRUNG TÂM THÔNG BÁO - tính toán ngay trong app từ dữ liệu hiện có
// (đơn/đề nghị vừa xử lý, dữ liệu công vừa bị sửa, yêu cầu đang chờ...).
// Đây là thông báo TRONG APP khi đang mở, KHÔNG phải push đẩy khi tắt app.
// Trạng thái "đã đọc" lưu riêng theo từng người trên chính máy đó.
// =====================================================================
function getNotifReadSet(u) {
  try { return new Set(JSON.parse(localStorage.getItem("cc_notif_read_" + u.id) || "[]")); }
  catch (e) { return new Set(); }
}
function saveNotifReadSet(u, set) {
  localStorage.setItem("cc_notif_read_" + u.id, JSON.stringify([...set]));
}

function computeNotifications(u) {
  const list = [];
  const mgr = isAdmin(u) || hasPerm(u, "duyetNghiPhep") || hasPerm(u, "duyetDeNghiCong");

  // Của tôi: đơn nghỉ phép đã được xử lý
  state.leaveRequests.filter((l) => !l.deleted && l.employeeId === u.id && l.trangThai !== "ChoDuyet" && l.nguoiDuyet).forEach((l) => {
    list.push({ id: "leave-" + l.id, time: l.updatedAt,
      text: `Đơn nghỉ phép (${l.loaiNghi}, ${l.tuNgay} → ${l.denNgay}) đã được ${l.trangThai === "DaDuyet" ? "DUYỆT" : "TỪ CHỐI"}.` });
  });

  // Của tôi: đề nghị sửa công đã được xử lý
  state.correctionRequests.filter((c) => !c.deleted && c.employeeId === u.id && c.trangThai !== "ChoDuyet" && c.nguoiDuyet).forEach((c) => {
    list.push({ id: "cor-" + c.id, time: c.updatedAt,
      text: `Đề nghị sửa công ngày ${c.ngayCanSua} đã được ${c.trangThai === "DaDuyet" ? "DUYỆT" : "TỪ CHỐI"}.` });
  });

  // Của tôi: dữ liệu chấm công vừa bị người khác cập nhật
  state.auditLog.filter((a) => !a.deleted && a.employeeId === u.id && a.nguoiThucHien !== u.id).forEach((a) => {
    const nguoi = state.employees.find((e) => e.id === a.nguoiThucHien);
    list.push({ id: "audit-" + a.id, time: a.updatedAt,
      text: `Dữ liệu chấm công ngày ${a.ngay} của bạn vừa được ${nguoi ? nguoi.hoTen : "quản lý"} cập nhật.` });
  });

  // Quản lý/Admin: có yêu cầu đang chờ duyệt
  if (mgr) {
    state.leaveRequests.filter((l) => !l.deleted && l.trangThai === "ChoDuyet" && l.employeeId !== u.id).forEach((l) => {
      const emp = state.employees.find((e) => e.id === l.employeeId);
      list.push({ id: "leavepending-" + l.id, time: l.updatedAt, text: `${emp ? emp.hoTen : l.employeeId} gửi đơn nghỉ phép, đang chờ bạn duyệt.` });
    });
    state.correctionRequests.filter((c) => !c.deleted && c.trangThai === "ChoDuyet" && c.employeeId !== u.id).forEach((c) => {
      const emp = state.employees.find((e) => e.id === c.employeeId);
      list.push({ id: "corpending-" + c.id, time: c.updatedAt, text: `${emp ? emp.hoTen : c.employeeId} gửi đề nghị sửa công ngày ${c.ngayCanSua}, đang chờ bạn duyệt.` });
    });
  }

  // Thông báo nội bộ do Admin/người được cấp quyền gửi (toàn bộ hoặc riêng mình)
  state.announcements.filter((a) => !a.deleted && a.nguoiGui !== u.id && (a.doiTuong === "ALL" || a.doiTuong === u.id)).forEach((a) => {
    list.push({ id: "tb-" + a.id, time: a.updatedAt, announcement: true,
      text: `📢 ${a.tieuDe ? a.tieuDe + " — " : ""}${a.noiDung} (từ ${a.hoTenNguoiGui || "quản lý"})` });
  });

  return list.sort((a, b) => b.time - a.time);
}

// =====================================================================
// ÂM THANH THÔNG BÁO - tự tạo tiếng "ting" bằng Web Audio API, không cần
// file âm thanh ngoài. Chỉ phát khi phát hiện thông báo THẬT SỰ MỚI kể
// từ lần kiểm tra trước (tránh kêu lại thông báo cũ mỗi lần đồng bộ).
// =====================================================================
let alertedNotifIds = null; // null = chưa khởi tạo cho phiên đăng nhập này

function playNotifSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    // Kêu 3 tiếng "ting-ting-ting" liên tiếp, âm lượng cao hơn hẳn để dễ chú ý
    const beepTimes = [0, 0.28, 0.56];
    beepTimes.forEach((startAt) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(1046, ctx.currentTime + startAt);       // C6 - cao, dễ nghe
      o.frequency.setValueAtTime(784, ctx.currentTime + startAt + 0.11); // G5
      g.gain.setValueAtTime(0.0001, ctx.currentTime + startAt);
      g.gain.exponentialRampToValueAtTime(0.9, ctx.currentTime + startAt + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + startAt + 0.24);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime + startAt);
      o.stop(ctx.currentTime + startAt + 0.26);
    });
  } catch (e) {
    // trình duyệt chặn âm thanh tự động (chưa có tương tác nào) - bỏ qua, không lỗi
  }
}

function resetNotifAlertTracking() { alertedNotifIds = null; }

function checkForNewNotifications(u) {
  if (!u) return;
  const notifs = computeNotifications(u);
  const currentIds = new Set(notifs.map((n) => n.id));
  if (alertedNotifIds === null) {
    // Lần đầu sau khi đăng nhập/mở app - chỉ ghi nhận mốc, KHÔNG kêu
    // (tránh kêu dồn dập cho các thông báo đã có từ trước).
    alertedNotifIds = currentIds;
    return;
  }
  const hasNew = notifs.some((n) => !alertedNotifIds.has(n.id));
  if (hasNew) {
    playNotifSound();
    if (navigator.vibrate) navigator.vibrate([250, 100, 250, 100, 250]);
  }
  alertedNotifIds = currentIds;
}

// Múi giờ CỐ ĐỊNH Hà Nội - không phụ thuộc cài đặt múi giờ trên điện thoại,
// đảm bảo mọi nhân viên (dù máy cài sai giờ) vẫn chấm công đúng giờ Việt Nam.
const VN_TZ = "Asia/Ho_Chi_Minh";
function nowVNParts() {
  const fmt = new Intl.DateTimeFormat("en-CA", {
    timeZone: VN_TZ, year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false,
  });
  const map = {};
  fmt.formatToParts(new Date()).forEach((p) => { map[p.type] = p.value; });
  return map;
}
function nowVNTimeStr() { const p = nowVNParts(); return `${p.hour}:${p.minute}:${p.second}`; }
function nowVNDateStr() { const p = nowVNParts(); return `${p.day}/${p.month}/${p.year}`; }
function nowVNDayKey() { const p = nowVNParts(); return `${p.year}-${p.month}-${p.day}`; }
function nowVNWeekdayLong() {
  return new Intl.DateTimeFormat("vi-VN", { timeZone: VN_TZ, weekday: "long", day: "2-digit", month: "2-digit", year: "numeric" }).format(new Date());
}
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove("show"), 2600);
}

// =====================================================================
// BỘ NHẬP LIỆU NỘI BỘ - thay thế HOÀN TOÀN các UI hệ thống/trình duyệt
// (bàn phím số, popup <select>, lịch chọn ngày, đồng hồ chọn giờ).
// Mọi tương tác đều vẽ ngay trong app bằng HTML/CSS/JS thuần, không có
// input nào thực sự focus -> không thể bị autofill/gợi ý can thiệp.
// =====================================================================

// ---- 1. Bàn phím số tự vẽ (dùng cho PIN và các ô số khác) ----
const digitEntries = {};

function renderDigitEntry(idPrefix, opts) {
  opts = opts || {};
  const maxLen = opts.maxLen || 6;
  const mask = opts.mask !== false;
  digitEntries[idPrefix] = { value: opts.initial != null ? String(opts.initial) : "", maxLen, mask };
  const keys = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "", "0", "DEL"];
  return `
    <div class="${mask ? "pin-display" : "num-display"}" id="${idPrefix}_display"></div>
    <div class="pin-keypad">
      ${keys.map((k) => k === ""
        ? `<div class="pin-key pin-key-empty"></div>`
        : `<button type="button" class="pin-key ${k === "DEL" ? "pin-key-del" : ""}" data-digitkey="${idPrefix}" data-key="${k}">${k === "DEL" ? "⌫" : k}</button>`
      ).join("")}
    </div>
  `;
}

function bindDigitEntry(idPrefix) {
  updateDigitDisplay(idPrefix);
  document.querySelectorAll(`[data-digitkey="${idPrefix}"]`).forEach((btn) => {
    btn.onclick = () => {
      const entry = digitEntries[idPrefix];
      if (!entry) return;
      const key = btn.dataset.key;
      if (key === "DEL") entry.value = entry.value.slice(0, -1);
      else if (entry.value.length < entry.maxLen) entry.value += key;
      updateDigitDisplay(idPrefix);
    };
  });
}

function updateDigitDisplay(idPrefix) {
  const entry = digitEntries[idPrefix];
  const el = document.getElementById(idPrefix + "_display");
  if (!el || !entry) return;
  if (entry.mask) {
    let dots = "";
    for (let i = 0; i < entry.maxLen; i++) dots += `<span class="pin-dot ${i < entry.value.length ? "filled" : ""}"></span>`;
    el.innerHTML = dots;
  } else {
    el.textContent = entry.value || "0";
  }
}

function getDigitValue(idPrefix) { return (digitEntries[idPrefix] && digitEntries[idPrefix].value) || ""; }

// Alias PIN (giữ nguyên tên hàm cũ để không phải sửa các nơi đã dùng)
function renderPinEntry(idPrefix, maxLen) { return renderDigitEntry(idPrefix, { maxLen: maxLen || 6, mask: true }); }
function bindPinEntry(idPrefix) { bindDigitEntry(idPrefix); }
function getPinValue(idPrefix) { return getDigitValue(idPrefix); }
function resetPinValue(idPrefix) { digitEntries[idPrefix] = { value: "", maxLen: 6, mask: true }; }

// Ô số thường (không che), dùng cho Số phút trễ, Bán kính GPS...
function renderNumberEntry(idPrefix, initial, maxLen) { return renderDigitEntry(idPrefix, { initial, maxLen: maxLen || 5, mask: false }); }
function bindNumberEntry(idPrefix) { bindDigitEntry(idPrefix); }
function getNumberValue(idPrefix) { return Number(getDigitValue(idPrefix)) || 0; }

// ---- 2. Dropdown tự vẽ (thay thế <select>) ----
const selectValues = {};

function renderCustomSelect(idPrefix, options, selected) {
  selectValues[idPrefix] = selected != null ? selected : options[0].value;
  const selectedLabel = (options.find((o) => o.value === selectValues[idPrefix]) || options[0]).label;
  return `
    <div class="custom-select" id="${idPrefix}_wrap">
      <button type="button" class="input custom-select-btn" id="${idPrefix}_btn">
        <span id="${idPrefix}_label">${selectedLabel}</span><span style="color:var(--sub);">▾</span>
      </button>
      <div class="custom-select-list" id="${idPrefix}_list">
        ${options.map((o) => `<div class="custom-select-item" data-select="${idPrefix}" data-value="${o.value}">${o.label}</div>`).join("")}
      </div>
    </div>
  `;
}

function bindCustomSelect(idPrefix, onChange) {
  const btn = document.getElementById(idPrefix + "_btn");
  const list = document.getElementById(idPrefix + "_list");
  if (!btn || !list) return;
  btn.onclick = (e) => {
    e.stopPropagation();
    document.querySelectorAll(".custom-select-list.show").forEach((l) => { if (l !== list) l.classList.remove("show"); });
    list.classList.toggle("show");
  };
  document.querySelectorAll(`[data-select="${idPrefix}"]`).forEach((item) => {
    item.onclick = (e) => {
      e.stopPropagation();
      const val = item.dataset.value;
      selectValues[idPrefix] = val;
      document.getElementById(idPrefix + "_label").textContent = item.textContent;
      list.classList.remove("show");
      if (onChange) onChange(val);
    };
  });
}

function getSelectValue(idPrefix) { return selectValues[idPrefix]; }

document.addEventListener("click", () => {
  document.querySelectorAll(".custom-select-list.show").forEach((l) => l.classList.remove("show"));
});

// ---- 3. Bộ chọn NGÀY tự vẽ (3 dropdown Ngày/Tháng/Năm - thay <input type="date">) ----
function renderCustomDate(idPrefix, initialYMD) {
  let y, m, d;
  if (initialYMD) { const p = initialYMD.split("-"); y = Number(p[0]); m = Number(p[1]); d = Number(p[2]); }
  if (!y) { const vn = nowVNParts(); y = Number(vn.year); m = Number(vn.month); d = Number(vn.day); }
  const dayOpts = Array.from({ length: 31 }, (_, i) => ({ value: String(i + 1).padStart(2, "0"), label: "Ngày " + (i + 1) }));
  const monthOpts = Array.from({ length: 12 }, (_, i) => ({ value: String(i + 1).padStart(2, "0"), label: "Tháng " + (i + 1) }));
  const yearOpts = Array.from({ length: 4 }, (_, i) => { const yy = Number(nowVNParts().year) - 1 + i; return { value: String(yy), label: String(yy) }; });
  return `
    <div class="custom-date-row">
      ${renderCustomSelect(idPrefix + "_d", dayOpts, String(d).padStart(2, "0"))}
      ${renderCustomSelect(idPrefix + "_m", monthOpts, String(m).padStart(2, "0"))}
      ${renderCustomSelect(idPrefix + "_y", yearOpts, String(y))}
    </div>
  `;
}
function bindCustomDate(idPrefix) {
  bindCustomSelect(idPrefix + "_d");
  bindCustomSelect(idPrefix + "_m");
  bindCustomSelect(idPrefix + "_y");
}
function getCustomDateValue(idPrefix) {
  return `${getSelectValue(idPrefix + "_y")}-${getSelectValue(idPrefix + "_m")}-${getSelectValue(idPrefix + "_d")}`;
}

// ---- 4. Bộ chọn GIỜ tự vẽ (2 dropdown Giờ/Phút - thay việc gõ tay "HH:mm") ----
function renderCustomTime(idPrefix, initialHM) {
  let h = 8, mnt = 0;
  if (initialHM && initialHM.includes(":")) { const p = initialHM.split(":"); h = Number(p[0]) || 0; mnt = Number(p[1]) || 0; }
  // Làm tròn theo TỔNG SỐ PHÚT trong ngày (không làm tròn riêng phút), để khi
  // phút vượt quá 59 sẽ tự "mang" sang giờ đúng, không bị lệch giờ hiển thị.
  const DAY_MIN = 24 * 60;
  let totalMin = h * 60 + mnt;
  totalMin = Math.round(totalMin / 5) * 5;
  totalMin = ((totalMin % DAY_MIN) + DAY_MIN) % DAY_MIN; // đảm bảo luôn trong khoảng 1 ngày
  const roundedHour = Math.floor(totalMin / 60);
  const roundedMinute = totalMin % 60;

  const hourOpts = Array.from({ length: 24 }, (_, i) => ({ value: String(i).padStart(2, "0"), label: String(i).padStart(2, "0") + " giờ" }));
  const minuteOpts = Array.from({ length: 12 }, (_, i) => { const mm = i * 5; return { value: String(mm).padStart(2, "0"), label: String(mm).padStart(2, "0") + " phút" }; });
  return `
    <div class="custom-date-row">
      ${renderCustomSelect(idPrefix + "_h", hourOpts, String(roundedHour).padStart(2, "0"))}
      ${renderCustomSelect(idPrefix + "_m", minuteOpts, String(roundedMinute).padStart(2, "0"))}
    </div>
  `;
}
function bindCustomTime(idPrefix) {
  bindCustomSelect(idPrefix + "_h");
  bindCustomSelect(idPrefix + "_m");
}
function getCustomTimeValue(idPrefix) {
  return `${getSelectValue(idPrefix + "_h")}:${getSelectValue(idPrefix + "_m")}`;
}



function activeEmployees() { return state.employees.filter((e) => !e.deleted); }
function currentUser() {
  if (!session) return null;
  return activeEmployees().find((e) => e.id === session.employeeId) || null;
}
function isManager(u) { u = u || currentUser(); return u && (u.vaiTro === "QuanLy" || u.vaiTro === "Admin"); }
function isAdmin(u) { u = u || currentUser(); return u && u.vaiTro === "Admin"; }
// Quyền chi tiết do Admin cấp riêng cho từng người (ngoài Admin luôn có full quyền)
const PERMISSIONS = {
  suaChamCong: "Sửa giờ chấm công của nhân viên",
  duyetNghiPhep: "Duyệt / từ chối đơn nghỉ phép",
  duyetDeNghiCong: "Duyệt / từ chối đề nghị sửa công",
  quanLyNhanVien: "Thêm / sửa thông tin nhân viên",
  xemBaoCao: "Xem báo cáo tổng hợp",
  guiThongBao: "Gửi tin nhắn thông báo đến nhân viên",
};
function hasPerm(u, key) {
  u = u || currentUser();
  if (!u) return false;
  if (u.vaiTro === "Admin") return true;
  return !!(u.quyen && u.quyen[key]);
}
function canSeeEmployeesTab(u) { return isAdmin(u) || hasPerm(u, "quanLyNhanVien"); }
function canSeeReportTab(u) { return isAdmin(u) || hasPerm(u, "xemBaoCao") || hasPerm(u, "duyetNghiPhep") || hasPerm(u, "duyetDeNghiCong"); }

// Phân cấp duyệt: Nhân viên thường -> Quản lý (có quyền) hoặc Admin đều duyệt được.
// Quản lý -> CHỈ Admin mới duyệt được (Quản lý không duyệt được yêu cầu của Quản lý khác).
function canApproveRequest(approver, submitterEmployee, permKey) {
  if (isAdmin(approver)) return true; // Admin duyệt được mọi cấp
  if (!hasPerm(approver, permKey)) return false; // chưa có quyền duyệt cơ bản
  const submitterRole = submitterEmployee ? submitterEmployee.vaiTro : "NhanVien";
  // Người gửi là Quản lý (hoặc Admin) -> chỉ Admin mới duyệt được, Quản lý khác không được phép
  return submitterRole !== "QuanLy" && submitterRole !== "Admin";
}

// =====================================================================
// SYNC — GỘP DỮ LIỆU THEO updatedAt, KHÔNG GHI ĐÈ (client-side merge)
// =====================================================================
function mergeCollection(localList, serverList) {
  const map = {};
  (localList || []).forEach((it) => (map[it.id] = it));
  (serverList || []).forEach((it) => {
    const existing = map[it.id];
    if (!existing || (it.updatedAt || 0) > (existing.updatedAt || 0)) map[it.id] = it;
  });
  return Object.values(map);
}
function mergeServerIntoLocal(serverData) {
  state.employees = mergeCollection(state.employees, serverData.employees);
  state.records = mergeCollection(state.records, serverData.records);
  state.leaveRequests = mergeCollection(state.leaveRequests, serverData.leaveRequests);
  state.correctionRequests = mergeCollection(state.correctionRequests, serverData.correctionRequests);
  state.auditLog = mergeCollection(state.auditLog, serverData.auditLog);
  state.announcements = mergeCollection(state.announcements, serverData.announcements);
  state.shifts = mergeCollection(state.shifts, serverData.shifts);
  if (serverData.config && (serverData.config.updatedAt || 0) >= (state.config.updatedAt || 0)) {
    state.config = serverData.config;
  }
  saveLocal();
}

function scheduleSync() {
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncPush, 4000);
}

async function apiCall(method, params) {
  if (method === "GET") {
    const url = new URL(API_URL);
    url.searchParams.set("token", APP_TOKEN);
    if (session && session.token) url.searchParams.set("session", session.token);
    Object.entries(params || {}).forEach(([k, v]) => v != null && url.searchParams.set(k, v));
    const res = await fetch(url.toString());
    return res.json();
  } else {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ token: APP_TOKEN, session: session ? session.token : null, ...params }),
    });
    return res.json();
  }
}

// Khi server báo phiên hết hạn/không hợp lệ - buộc đăng nhập lại, không âm thầm thất bại
function handleSessionExpired() {
  session = null;
  localStorage.removeItem(SESSION_KEY);
  toast("Phiên đăng nhập đã hết hạn, vui lòng đăng nhập lại.");
  renderApp();
}

async function syncPush() {
  if (syncing) return;
  syncing = true;
  try {
    const res = await apiCall("POST", {
      action: "sync",
      data: {
        employees: state.employees, records: state.records,
        leaveRequests: state.leaveRequests, correctionRequests: state.correctionRequests,
        auditLog: state.auditLog, announcements: state.announcements, shifts: state.shifts, config: state.config,
      },
    });
    if (res.success) {
      mergeServerIntoLocal(res.data);
      renderApp();
    } else if (res.sessionExpired) {
      handleSessionExpired();
    } else {
      toast("Đồng bộ lỗi: " + res.error);
    }
  } catch (e) {
    // offline hoặc mất mạng - dữ liệu vẫn an toàn trong localStorage, thử lại sau
  } finally {
    syncing = false;
  }
}

async function syncPull(silent) {
  if (!session) return; // chưa đăng nhập thì chưa có session, không gọi pull
  try {
    const res = await apiCall("GET", { action: "pull" });
    if (res.success) {
      mergeServerIntoLocal(res.data);
      // Kiểm tra có thông báo THẬT SỰ MỚI không để phát âm thanh - làm được kể cả
      // khi đồng bộ chạy ngầm (không vẽ lại giao diện), vì âm thanh không cần render.
      const u = currentUser();
      if (u) checkForNewNotifications(u);

// =====================================================================
// GPS
// =====================================================================
function getLocation() {
  // Thử lần 1: độ chính xác cao (GPS vệ tinh thật) - tốt nhất nhưng có thể chậm/thất bại trong nhà
  const tryHighAccuracy = () => new Promise((resolve) => {
    if (!navigator.geolocation) return resolve(null);
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy }),
      () => resolve(null),
      { timeout: 8000, enableHighAccuracy: true, maximumAge: 0 }
    );
  });
  // Thử lần 2 (dự phòng): định vị theo WiFi/cột sóng - kém chính xác hơn nhưng
  // nhanh và hoạt động tốt hơn trong nhà/nơi tín hiệu GPS yếu.
  const tryLowAccuracy = () => new Promise((resolve) => {
    if (!navigator.geolocation) return resolve(null);
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy }),
      () => resolve(null),
      { timeout: 12000, enableHighAccuracy: false, maximumAge: 30000 }
    );
  });
  return tryHighAccuracy().then((loc) => loc || tryLowAccuracy());
}
function distMeters(a, b) {
  if (!a || !b || a.lat == null || b.lat == null) return null;
  const R = 6371000, toRad = (x) => (x * Math.PI) / 180;
  const dLat = toRad(b.lat - a.lat), dLng = toRad(b.lng - a.lng);
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1 - s));
}

// =====================================================================
// NÉN ẢNH MINH CHỨNG - Google Sheets giới hạn ~50.000 ký tự/ô, nên nén
// nhỏ + giảm chất lượng trước khi lưu dạng base64.
// =====================================================================
const MAX_IMAGE_BASE64_LEN = 40000;
function compressImageFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const maxW = 480;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        let quality = 0.5;
        let dataUrl = canvas.toDataURL("image/jpeg", quality);
        while (dataUrl.length > MAX_IMAGE_BASE64_LEN && quality > 0.15) {
          quality -= 0.1;
          dataUrl = canvas.toDataURL("image/jpeg", quality);
        }
        if (dataUrl.length > MAX_IMAGE_BASE64_LEN) { resolve(null); return; } // vẫn quá lớn, bỏ qua
        resolve(dataUrl);
      };
      img.onerror = () => reject(new Error("Không đọc được ảnh"));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error("Không đọc được tệp"));
    reader.readAsDataURL(file);
  });
}

async function doLogin(maNV, pin) {
  const res = await apiCall("GET", { action: "login", maNV, pin });
  if (!res.success) return { ok: false, error: res.error };
  // gộp nhân viên vừa xác thực vào local (không có PIN, server đã ẩn đi)
  state.employees = mergeCollection(state.employees, [res.data]);
  saveLocal();
  session = { employeeId: res.data.id, token: res.session };
  localStorage.setItem(SESSION_KEY, JSON.stringify(session));
  resetNotifAlertTracking(); // đăng nhập lại - không kêu dồn dập thông báo cũ
  return { ok: true };
}
function doLogout() {
  // Huỷ session thật ở phía server, không chỉ xoá trên máy
  if (session && session.token) {
    apiCall("GET", { action: "logout" }).catch(() => {});
  }
  session = null;
  localStorage.removeItem(SESSION_KEY);
  resetNotifAlertTracking();
  currentTab = "checkin";
  renderApp();
}

function todayKey() { return nowVNDayKey(); }
function todayVN() { return nowVNDateStr(); }
function myTodayRecord(u) {
  return state.records.find((r) => !r.deleted && r.employeeId === u.id && r.dayKey === todayKey());
}

// So sánh giờ vào thực tế với Giờ vào chuẩn + Số phút cho phép trễ (trong Cài đặt).
// Trả về true nếu đi trễ vượt quá mức cho phép.
function isLate(gioVaoStr) {
  if (!gioVaoStr || !state.config.gioChuan) return false;
  const toMin = (s) => { const [h, m] = s.split(":").map(Number); return (h || 0) * 60 + (m || 0); };
  const actual = toMin(gioVaoStr);
  const allowed = toMin(state.config.gioChuan) + (Number(state.config.soPhutChoPhepTre) || 0);
  return actual > allowed;
}

// So sánh giờ ra thực tế với Giờ ra chuẩn - về sớm nếu ra trước quá mức cho phép
function isEarlyLeave(gioRaStr) {
  if (!gioRaStr || !state.config.gioRaChuan) return false;
  const toMin = (s) => { const [h, m] = s.split(":").map(Number); return (h || 0) * 60 + (m || 0); };
  const actual = toMin(gioRaStr);
  const allowed = toMin(state.config.gioRaChuan) - (Number(state.config.soPhutChoPhepTre) || 0);
  return actual < allowed;
}

// Số giờ làm thêm = thời gian làm việc SAU giờ ra chuẩn (nếu có)
function overtimeHours(record) {
  if (!record || !record.gioRa || !state.config.gioRaChuan) return 0;
  const toMin = (s) => { const [h, m] = s.split(":").map(Number); return (h || 0) * 60 + (m || 0); };
  const diff = toMin(record.gioRa) - toMin(state.config.gioRaChuan);
  return diff > 0 ? Math.round((diff / 60) * 100) / 100 : 0;
}

// Tính 4 chỉ số tổng quan tháng cho 1 nhân viên: tổng công, giờ làm thêm, số lần trễ/sớm, số ngày nghỉ
function computeMonthStats(employeeId, year, month) {
  const prefix = `${year}-${String(month).padStart(2, "0")}`;
  const monthRecords = state.records.filter((r) => !r.deleted && r.employeeId === employeeId && r.dayKey && r.dayKey.startsWith(prefix));
  let tongCong = 0, tongGioLamThem = 0, soLanTreSom = 0;
  monthRecords.forEach((r) => {
    if (r.gioVao) tongCong += 1;
    tongGioLamThem += overtimeHours(r);
    if ((r.gioVao && isLate(r.gioVao)) || (r.gioRa && isEarlyLeave(r.gioRa))) soLanTreSom += 1;
  });
  const soNgayNghi = state.leaveRequests
    .filter((l) => !l.deleted && l.employeeId === employeeId && l.trangThai === "DaDuyet")
    .reduce((sum, l) => sum + daysInLeaveWithinMonth(l, year, month), 0);
  return { tongCong, tongGioLamThem, soLanTreSom, soNgayNghi, records: monthRecords };
}

// Đếm số ngày của 1 đơn nghỉ phép rơi vào đúng tháng đang xét (đơn có thể trải dài nhiều tháng)
function daysInLeaveWithinMonth(leave, year, month) {
  if (!leave.tuNgay || !leave.denNgay) return 0;
  const start = new Date(leave.tuNgay + "T00:00:00");
  const end = new Date(leave.denNgay + "T00:00:00");
  const monthStart = new Date(year, month - 1, 1);
  const monthEnd = new Date(year, month, 0);
  const from = start > monthStart ? start : monthStart;
  const to = end < monthEnd ? end : monthEnd;
  if (from > to) return 0;
  return Math.round((to - from) / 86400000) + 1;
}

function bindScreenEventsCheckin(u) {
  const clockEl = document.getElementById("clock");
  if (clockEl) {
    clearInterval(window._clockTimer);
    window._clockTimer = setInterval(() => {
      const el = document.getElementById("clock");
      if (!el) { clearInterval(window._clockTimer); return; }
      el.textContent = nowVNTimeStr();
    }, 1000);
  }

  const p = nowVNParts();
  document.querySelectorAll("[data-stat-row]").forEach((row) => {
    row.onclick = () => openStatDetail(row.dataset.statRow, u, Number(p.year), Number(p.month));
  });

  const notifBtn = document.getElementById("btnNotif");
  if (notifBtn) notifBtn.onclick = () => openNotificationsSheet(u);

  const btn = document.getElementById("btnCheck");
  if (!btn) return;
  btn.onclick = async () => {
    btn.disabled = true;
    const msg = document.getElementById("ckMsg");
    msg.textContent = "Đang xác định vị trí...";

    const loc = await getLocation();

    if (state.config.batBuocGPS) {
      // Admin chưa đặt vị trí công ty -> chặn tuyệt đối, không cho chấm công
      if (!state.config.viTriCongTy || state.config.viTriCongTy.lat == null) {
        msg.textContent = "Chưa cấu hình vị trí công ty. Liên hệ Admin để cài đặt trước khi chấm công.";
        btn.disabled = false; return;
      }
      // Không lấy được vị trí (từ chối quyền, thiết bị không hỗ trợ...) -> chặn
      if (!loc) {
        msg.textContent = "Không lấy được vị trí của bạn. Vui lòng bật quyền định vị (GPS) rồi thử lại.";
        btn.disabled = false; return;
      }
      const d = distMeters(loc, state.config.viTriCongTy);
      if (d != null && d > state.config.banKinhGPS) {
        msg.textContent = `Bạn đang cách văn phòng ${Math.round(d)}m (cho phép tối đa ${state.config.banKinhGPS}m). Cần đến đúng vị trí công ty để chấm công.`;
        btn.disabled = false; return;
      }
      msg.textContent = "";
    }

    let rec = myTodayRecord(u);
    const nowStr = nowVNTimeStr();
    if (!rec) {
      rec = { id: genId("CC"), employeeId: u.id, dayKey: todayKey(), ngay: todayVN(), gioVao: nowStr, gioRa: "", viTriVao: loc ? `${loc.lat.toFixed(4)},${loc.lng.toFixed(4)}` : "", viTriRa: "", tongGio: "", ghiChu: "", updatedAt: nowMs(), deleted: false };
      state.records.push(rec);
    } else if (!rec.gioRa) {
      rec.gioRa = nowStr;
      rec.viTriRa = loc ? `${loc.lat.toFixed(4)},${loc.lng.toFixed(4)}` : "";
      rec.tongGio = calcHours(rec.gioVao, rec.gioRa);
      rec.updatedAt = nowMs();
    }
    saveLocal();
    renderApp();
    scheduleSync();
    toast("Đã ghi nhận chấm công.");
  };
}

function openStatDetail(kind, u, year, month) {
  const stats = computeMonthStats(u.id, year, month);
  let title = "", rowsHtml = "";

  if (kind === "tongCong") {
    title = "Chi tiết công hưởng lương";
    const days = stats.records.filter((r) => r.gioVao).sort((a, b) => (a.dayKey < b.dayKey ? 1 : -1));
    rowsHtml = days.length === 0 ? `<div class="empty">Chưa có ngày công nào.</div>` :
      days.map((r) => `<div style="padding:10px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;">
        <span>${r.ngay}</span><span class="sub">${r.gioVao} → ${r.gioRa || "—"}</span></div>`).join("");
  } else if (kind === "tongGioLamThem") {
    title = "Chi tiết giờ làm thêm";
    const days = stats.records.filter((r) => overtimeHours(r) > 0).sort((a, b) => (a.dayKey < b.dayKey ? 1 : -1));
    rowsHtml = days.length === 0 ? `<div class="empty">Chưa có giờ làm thêm nào.</div>` :
      days.map((r) => `<div style="padding:10px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;">
        <span>${r.ngay}</span><span style="color:var(--primary);font-weight:600;">+${overtimeHours(r).toFixed(1)}h (ra lúc ${r.gioRa})</span></div>`).join("");
  } else if (kind === "treSom") {
    title = "Chi tiết đi muộn / về sớm";
    const days = stats.records.filter((r) => (r.gioVao && isLate(r.gioVao)) || (r.gioRa && isEarlyLeave(r.gioRa)))
      .sort((a, b) => (a.dayKey < b.dayKey ? 1 : -1));
    rowsHtml = days.length === 0 ? `<div class="empty">Không có lần đi muộn/về sớm nào.</div>` :
      days.map((r) => {
        const reasons = [];
        if (r.gioVao && isLate(r.gioVao)) reasons.push(`Đi muộn (vào ${r.gioVao})`);
        if (r.gioRa && isEarlyLeave(r.gioRa)) reasons.push(`Về sớm (ra ${r.gioRa})`);
        return `<div style="padding:10px 0;border-bottom:1px solid var(--line);">
          <div style="display:flex;justify-content:space-between;"><span>${r.ngay}</span></div>
          <div class="sub" style="color:var(--amber);">${reasons.join(" · ")}</div></div>`;
      }).join("");
  } else if (kind === "ngayNghi") {
    title = "Chi tiết ngày nghỉ";
    const leaves = state.leaveRequests.filter((l) => !l.deleted && l.employeeId === u.id && l.trangThai === "DaDuyet" && daysInLeaveWithinMonth(l, year, month) > 0);
    rowsHtml = leaves.length === 0 ? `<div class="empty">Không có ngày nghỉ nào trong tháng.</div>` :
      leaves.map((l) => `<div style="padding:10px 0;border-bottom:1px solid var(--line);">
        <div style="display:flex;justify-content:space-between;"><span style="font-weight:600;">${l.loaiNghi}</span><span class="sub">${daysInLeaveWithinMonth(l, year, month)} ngày</span></div>
        <div class="sub">${l.tuNgay} → ${l.denNgay}</div></div>`).join("");
  }

  openSheet(`
    <div class="sheet-title">${title}</div>
    <div style="max-height:60vh;overflow-y:auto;">${rowsHtml}</div>
    <button class="btn btn-outline" id="stat_close" style="margin-top:14px;">Đóng</button>
  `);
  document.getElementById("stat_close").onclick = closeSheet;
}

function calcHours(vaoStr, raStr) {
  const [h1, m1, s1] = vaoStr.split(":").map(Number);
  const [h2, m2, s2] = raStr.split(":").map(Number);
  const p1 = h1 * 60 + m1 + (s1 || 0) / 60, p2 = h2 * 60 + m2 + (s2 || 0) / 60;
  return Math.max(0, Math.round(((p2 - p1) / 60) * 100) / 100);
}

    </div>

    ${bcState.mode === "calendar" ? renderBcCalendar(bcState.year, bcState.month, recMap) : renderBcList(stats.records)}
  </div>`;
}

function renderBcCalendar(year, month, recMap) {
  const firstDay = new Date(year, month - 1, 1);
  const daysInMonth = new Date(year, month, 0).getDate();
  const firstWeekday = (firstDay.getDay() + 6) % 7; // 0=T2 ... 6=CN
  const cells = [];
  for (let i = 0; i < firstWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  while (cells.length % 7 !== 0) cells.push(null);
  const todayK = nowVNDayKey();

  let html = `<div class="card" style="padding:10px;">
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px;">
      ${VN_WEEKDAYS.map((w) => `<div style="text-align:center;font-size:11px;color:var(--sub);font-weight:700;">${w}</div>`).join("")}
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;">`;
  cells.forEach((d) => {
    if (d == null) { html += `<div></div>`; return; }
    const dayKey = `${year}-${String(month).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    const rec = recMap[dayKey];
    let bg = "transparent", color = "var(--ink)";
    if (rec && rec.gioVao) {
      const late = isLate(rec.gioVao) || (rec.gioRa && isEarlyLeave(rec.gioRa));
      bg = late ? "#FDF3E4" : "#E7F8F0";
      color = late ? "var(--amber)" : "var(--green)";
    }
    const isToday = dayKey === todayK;
    html += `<button type="button" data-bcday="${dayKey}" style="aspect-ratio:1;border:none;border-radius:8px;background:${bg};color:${color};font-size:13px;font-weight:${isToday ? 800 : 600};cursor:pointer;${isToday ? "outline:2px solid var(--primary);outline-offset:-2px;" : ""}">${d}</button>`;
  });
  html += `</div></div>`;
  return html;
}

function renderBcList(records) {
  const sorted = [...records].sort((a, b) => (a.dayKey < b.dayKey ? 1 : -1));
  if (sorted.length === 0) return `<div class="card"><div class="empty">Chưa có dữ liệu tháng này.</div></div>`;
  return `<div class="card" style="padding:0;overflow:hidden;">
    ${sorted.map((r) => {
      const late = (r.gioVao && isLate(r.gioVao)) || (r.gioRa && isEarlyLeave(r.gioRa));
      return `<div class="list-item" style="padding:12px 16px;cursor:pointer;" data-bcday="${r.dayKey}">
        <div style="flex:1;min-width:0;">
          <div style="font-weight:600;">${r.ngay} ${late ? '<span class="pill" style="background:#FDF3E4;color:var(--amber);margin-left:6px;">Trễ/Sớm</span>' : ""}</div>
          <div class="sub">${r.gioVao || "—"} → ${r.gioRa || "—"}</div>
        </div>
        <div style="font-weight:700;color:var(--primary);">${r.tongGio ? r.tongGio + "h" : ""}</div>
      </div>`;
    }).join("")}
  </div>`;
}

  const isOwnDay = employeeId === currentUser.id;

    .filter((c) => !c.deleted && c.employeeId === employeeId && c.ngayCanSua === dayKey)

    ${rec ? `

    ${existingRequest ? `<div style="margin-top:10px;padding:10px;background:#F3F5F9;border-radius:10px;">

function openEditRecordForm(u, recordId) {

  openSheet(`

    <label class="sub">Giờ ra (HH:MM:SS, để trống nếu chưa ra)</label>

  `);
  document.getElementById("rec_cancel").onclick = closeSheet;
  document.getElementById("rec_save").onclick = () => {
    const gv = document.getElementById("rec_gv").value.trim();
    const gr = document.getElementById("rec_gr").value.trim();
    const err = document.getElementById("rec_err");
    const timePattern = /^([01]\d|2[0-3]):[0-5]\d(:[0-5]\d)?$/;
    if (gv && !timePattern.test(gv)) { err.textContent = "Giờ vào không đúng định dạng HH:MM hoặc HH:MM:SS."; return; }
    if (gr && !timePattern.test(gr)) { err.textContent = "Giờ ra không đúng định dạng HH:MM hoặc HH:MM:SS."; return; }
    const oldVals = { gioVao: rec.gioVao, gioRa: rec.gioRa };
    rec.gioVao = gv ? (gv.length === 5 ? gv + ":00" : gv) : "";
    rec.gioRa = gr ? (gr.length === 5 ? gr + ":00" : gr) : "";
    rec.ghiChu = document.getElementById("rec_ghichu").value.trim();
    rec.tongGio = (rec.gioVao && rec.gioRa) ? calcHours(rec.gioVao, rec.gioRa) : "";
    rec.updatedAt = nowMs();
    if (oldVals.gioVao !== rec.gioVao || oldVals.gioRa !== rec.gioRa) {
      logAuditChange(rec.employeeId, rec.dayKey, u.id, oldVals, { gioVao: rec.gioVao, gioRa: rec.gioRa }, "Sửa trực tiếp bởi " + u.hoTen, "SuaTrucTiep");
    }
    saveLocal(); closeSheet(); renderApp(); scheduleSync();
    toast("Đã cập nhật giờ chấm công.");
  };
}

let reportMonthState = { year: null, month: null };
function ensureReportMonthState() {
  if (reportMonthState.year == null) {
    const p = nowVNParts();
    reportMonthState.year = Number(p.year);
    reportMonthState.month = Number(p.month);
  }
}

function renderReport(u) {
  ensureReportMonthState();
  // Quyền XEM BÁO CÁO TỔNG HỢP (tổng quan công ty, chi tiết từng người) phải do
  // Admin cấp riêng ("xemBaoCao") - KHÔNG tự động có chỉ vì được quyền duyệt đơn.
  // Quyền duyệt đơn nghỉ phép / đề nghị sửa công chỉ cho thấy đúng phần đơn cần duyệt của họ.
  const canViewFullReport = isAdmin(u) || hasPerm(u, "xemBaoCao");
  const canViewLeaveSection = isAdmin(u) || hasPerm(u, "duyetNghiPhep");
  const canViewCorrectionSection = isAdmin(u) || hasPerm(u, "duyetDeNghiCong");

  const records = state.records.filter((r) => !r.deleted);
  const byEmp = {};
  records.forEach((r) => {
    if (!byEmp[r.employeeId]) byEmp[r.employeeId] = { tongGio: 0, soNgay: 0, soNgayTre: 0 };
    byEmp[r.employeeId].tongGio += Number(r.tongGio) || 0;
    if (r.gioVao) byEmp[r.employeeId].soNgay += 1;
    if (r.gioVao && isLate(r.gioVao)) byEmp[r.employeeId].soNgayTre += 1;
  });
  const rows = Object.entries(byEmp).map(([id, v]) => {
    const emp = state.employees.find((e) => e.id === id);
    return { id, hoTen: emp ? emp.hoTen : id, phongBan: emp ? emp.phongBan : "", ...v };
  }).sort((a, b) => b.tongGio - a.tongGio);

  const pendingLeaves = state.leaveRequests.filter((l) => !l.deleted && l.trangThai === "ChoDuyet");
  const pendingCorrections = state.correctionRequests.filter((c) => !c.deleted && c.trangThai === "ChoDuyet");
  const recentAudit = [...state.auditLog].filter((a) => !a.deleted).sort((a, b) => b.updatedAt - a.updatedAt).slice(0, 15);

  // Báo cáo tổng hợp THÁNG cho từng nhân viên - tổng công, làm thêm, trễ/sớm, ngày nghỉ
  const monthRows = activeEmployees().map((emp) => {
    const stats = computeMonthStats(emp.id, reportMonthState.year, reportMonthState.month);
    return { emp, ...stats };
  }).sort((a, b) => a.emp.hoTen.localeCompare(b.emp.hoTen, "vi"));

  // Gộp thành số liệu cấp CÔNG TY (tổng của tất cả nhân viên) để Quản lý/Admin nắm nhanh
  const companyStats = monthRows.reduce((acc, r) => {
    acc.tongCong += r.tongCong;
    acc.tongGioLamThem += r.tongGioLamThem;
    acc.tongTreSom += r.soLanTreSom;
    acc.tongNgayNghi += r.soNgayNghi;
    if (r.tongCong > 0) acc.tongNhanVienCoCong += 1;
    return acc;
  }, { tongCong: 0, tongGioLamThem: 0, tongTreSom: 0, tongNgayNghi: 0, tongNhanVienCoCong: 0 });

  return `

function bindReportEvents(u) {
  document.querySelectorAll("[data-approve]").forEach((b) => b.onclick = () => decideLeave(b.dataset.approve, "DaDuyet", u));
  document.querySelectorAll("[data-reject]").forEach((b) => b.onclick = () => decideLeave(b.dataset.reject, "TuChoi", u));
  document.querySelectorAll("[data-approve-cor]").forEach((b) => b.onclick = () => decideCorrection(b.dataset.approveCor, "DaDuyet", u));
  document.querySelectorAll("[data-reject-cor]").forEach((b) => b.onclick = () => decideCorrection(b.dataset.rejectCor, "TuChoi", u));

  const prevBtn = document.getElementById("rp_prev");
  if (prevBtn) prevBtn.onclick = () => {
    reportMonthState.month -= 1;
    if (reportMonthState.month < 1) { reportMonthState.month = 12; reportMonthState.year -= 1; }
    renderApp();
  };
  const nextBtn = document.getElementById("rp_next");
  if (nextBtn) nextBtn.onclick = () => {
    reportMonthState.month += 1;
    if (reportMonthState.month > 12) { reportMonthState.month = 1; reportMonthState.year += 1; }
    renderApp();
  };
  document.querySelectorAll("[data-emp-detail]").forEach((el) => {
    el.onclick = () => openEmployeeMonthDetail(el.dataset.empDetail, reportMonthState.year, reportMonthState.month);
  });
}
function openEmployeeMonthDetail(employeeId, year, month) {
  const emp = state.employees.find((e) => e.id === employeeId);
  const stats = computeMonthStats(employeeId, year, month);
  const myLeaves = state.leaveRequests.filter((l) => !l.deleted && l.employeeId === employeeId)
    .sort((a, b) => b.updatedAt - a.updatedAt);
  const myCorrections = state.correctionRequests.filter((c) => !c.deleted && c.employeeId === employeeId)
    .sort((a, b) => b.updatedAt - a.updatedAt);

  const statusPillHtml = (trangThai) => {
    const map = { DaDuyet: ["Đã duyệt", "#E7F8F0", "var(--green)"], TuChoi: ["Từ chối", "#FBEAEA", "var(--red)"], ChoDuyet: ["Chờ duyệt", "#FDF3E4", "var(--amber)"] };
    const [label, bg, color] = map[trangThai] || [trangThai, "#EEE", "#666"];
    return `<span class="pill" style="background:${bg};color:${color};">${label}</span>`;
  };

  openSheet(`
    <div class="sheet-title">${emp ? emp.hoTen : employeeId} — Tháng ${month}/${year}</div>
    <div class="row" style="margin-bottom:10px;">
      <div class="card" style="flex:1;margin-bottom:0;padding:10px;"><div style="font-size:16px;font-weight:800;color:var(--primary);">${stats.tongCong}</div><div class="sub" style="font-size:10.5px;">Công</div></div>
      <div class="card" style="flex:1;margin-bottom:0;padding:10px;"><div style="font-size:16px;font-weight:800;color:var(--green);">${stats.tongGioLamThem.toFixed(1)}h</div><div class="sub" style="font-size:10.5px;">Thêm giờ</div></div>
      <div class="card" style="flex:1;margin-bottom:0;padding:10px;"><div style="font-size:16px;font-weight:800;color:var(--amber);">${stats.soLanTreSom}</div><div class="sub" style="font-size:10.5px;">Trễ/sớm</div></div>
      <div class="card" style="flex:1;margin-bottom:0;padding:10px;"><div style="font-size:16px;font-weight:800;color:var(--red);">${stats.soNgayNghi}</div><div class="sub" style="font-size:10.5px;">Ngày nghỉ</div></div>
    </div>

    <div style="font-weight:700;margin:14px 0 8px;">Lịch sử đơn nghỉ phép (${myLeaves.length})</div>
    <div style="max-height:180px;overflow-y:auto;">

        myLeaves.map((l) => `<div style="padding:8px 0;border-bottom:1px solid var(--line);">
          <div style="display:flex;justify-content:space-between;"><span style="font-weight:600;font-size:13px;">${l.loaiNghi}</span>${statusPillHtml(l.trangThai)}</div>
          <div class="sub">${l.tuNgay} → ${l.denNgay} · ${l.lyDo || ""}</div>
        </div>`).join("")}
    </div>

    <div style="font-weight:700;margin:14px 0 8px;">Lịch sử đề nghị sửa công (${myCorrections.length})</div>
    <div style="max-height:180px;overflow-y:auto;">
      ${myCorrections.length === 0 ? `<div class="empty" style="padding:10px 0;">Chưa có đề nghị nào.</div>` :
        myCorrections.map((c) => `<div style="padding:8px 0;border-bottom:1px solid var(--line);">

          <div class="sub">Đề xuất: ${c.gioVaoDeXuat || "—"} → ${c.gioRaDeXuat || "—"} · ${c.lyDo || ""}</div>

  `);

function decideLeave(id, trangThai, u) {
  const l = state.leaveRequests.find((x) => x.id === id);
  if (!l) return;
  const emp = state.employees.find((e) => e.id === l.employeeId);
  if (!canApproveRequest(u, emp, "duyetNghiPhep")) { toast("Bạn không có quyền duyệt đơn này."); return; }
  l.trangThai = trangThai; l.nguoiDuyet = u.id; l.updatedAt = nowMs();
  saveLocal(); renderApp(); scheduleSync();
  toast(trangThai === "DaDuyet" ? "Đã duyệt đơn." : "Đã từ chối đơn.");
}

// Duyệt/từ chối đề nghị sửa công. Khi duyệt, tự động áp dụng giờ đề xuất
// vào đúng bản ghi chấm công thật (tạo mới nếu ngày đó chưa có bản ghi).
function decideCorrection(id, trangThai, u) {
  const c = state.correctionRequests.find((x) => x.id === id);
  if (!c) return;
  const emp = state.employees.find((e) => e.id === c.employeeId);
  if (!canApproveRequest(u, emp, "duyetDeNghiCong")) { toast("Bạn không có quyền duyệt đề nghị này."); return; }
  c.trangThai = trangThai; c.nguoiDuyet = u.id; c.updatedAt = nowMs();

  if (trangThai === "DaDuyet") {
    let rec = state.records.find((r) => !r.deleted && r.employeeId === c.employeeId && r.dayKey === c.ngayCanSua);
    const [y, m, d] = c.ngayCanSua.split("-");
    const ngayVN = `${d}/${m}/${y}`;
    const ghiChuMoi = `Cập nhật theo đề nghị #${c.id} (duyệt bởi ${u.hoTen}). Lý do: ${c.lyDo || ""}`;
    if (!rec) {
      rec = { id: genId("CC"), employeeId: c.employeeId, dayKey: c.ngayCanSua, ngay: ngayVN, gioVao: "", gioRa: "", viTriVao: "", viTriRa: "", tongGio: "", ghiChu: "", updatedAt: 0, deleted: false };
      state.records.push(rec);
    }
    const oldVals = { gioVao: rec.gioVao, gioRa: rec.gioRa };
    if (c.gioVaoDeXuat) rec.gioVao = c.gioVaoDeXuat.length === 5 ? c.gioVaoDeXuat + ":00" : c.gioVaoDeXuat;
    if (c.gioRaDeXuat) rec.gioRa = c.gioRaDeXuat.length === 5 ? c.gioRaDeXuat + ":00" : c.gioRaDeXuat;
    rec.tongGio = (rec.gioVao && rec.gioRa) ? calcHours(rec.gioVao, rec.gioRa) : "";
    rec.ghiChu = rec.ghiChu ? rec.ghiChu + " | " + ghiChuMoi : ghiChuMoi;
    rec.updatedAt = nowMs();
    logAuditChange(c.employeeId, c.ngayCanSua, u.id, oldVals, { gioVao: rec.gioVao, gioRa: rec.gioRa }, c.lyDo, "DuyetDeNghi");
  }

  saveLocal(); renderApp(); scheduleSync();
  toast(trangThai === "DaDuyet" ? "Đã duyệt và cập nhật bản ghi chấm công." : "Đã từ chối đề nghị.");
}

function openLeaveForm(u) {
  openSheet(`

    <label class="sub" style="display:block;margin-bottom:4px;">Loại nghỉ</label>
    ${renderCustomSelect("lv_loai", [
      { value: "Nghỉ phép năm", label: "Nghỉ phép năm" },
      { value: "Nghỉ ốm", label: "Nghỉ ốm" },
      { value: "Nghỉ không lương", label: "Nghỉ không lương" },
      { value: "Nghỉ việc riêng", label: "Nghỉ việc riêng" },
    ])}
    <label class="sub" style="display:block;margin-bottom:4px;">Từ ngày</label>
    ${renderCustomDate("lv_tu")}
    <label class="sub" style="display:block;margin-bottom:4px;">Đến ngày</label>
    ${renderCustomDate("lv_den")}
    <textarea class="input" id="lv_lydo" placeholder="Lý do" style="min-height:70px;"></textarea>
    <div id="lv_err" style="color:var(--red);font-size:12.5px;margin-bottom:10px;"></div>
    <div class="row"><button class="btn btn-outline" id="lv_cancel">Huỷ</button><button class="btn btn-primary" id="lv_save">Gửi đơn</button></div>
  `);
  bindCustomSelect("lv_loai");
  bindCustomDate("lv_tu");
  bindCustomDate("lv_den");
  document.getElementById("lv_cancel").onclick = closeSheet;
  document.getElementById("lv_save").onclick = () => {
    const tu = getCustomDateValue("lv_tu"), den = getCustomDateValue("lv_den");
    const err = document.getElementById("lv_err");
    if (!tu || !den) { err.textContent = "Chọn đủ ngày bắt đầu/kết thúc."; return; }
    state.leaveRequests.push({
      id: genId("DN"), employeeId: u.id, loaiNghi: getSelectValue("lv_loai"),
      tuNgay: tu, denNgay: den, lyDo: document.getElementById("lv_lydo").value.trim(),
      trangThai: "ChoDuyet", nguoiDuyet: "", updatedAt: nowMs(), deleted: false,
    });
    saveLocal(); closeSheet(); renderApp(); scheduleSync();
    toast("Đã gửi đơn nghỉ phép.");
  };
}

      <span class="pill" style="background:#E9F1FF;color:var(--primary);">${vaiTroLabel}</span>
      ${!admin ? `<div class="sub" style="margin-top:12px;text-align:left;">
        <b>Quyền được cấp:</b> ${Object.entries(PERMISSIONS).filter(([k]) => u.quyen && u.quyen[k]).map(([, label]) => label).join(", ") || "Không có quyền đặc biệt nào"}
      </div>` : ""}
    </div>

    <!-- ===== YÊU CẦU CỦA TÔI ===== -->
    <!-- Nút "Tạo đơn nghỉ phép" / "Đề nghị cập nhật công" đã có sẵn trong menu "Thêm"
         (thanh điều hướng dưới cùng) - không lặp lại nút tạo mới ở đây, chỉ hiện
         danh sách trạng thái các đơn/đề nghị đã gửi. -->
    <div class="settings-section-label">Yêu cầu của tôi</div>
    <div class="card">
      <div style="font-weight:700;margin-bottom:10px;">Đơn nghỉ phép của tôi</div>
      ${myLeaves.length === 0 ? `<div class="empty">Chưa có đơn nào.</div>` :
        myLeaves.slice(0, 5).map((l) => `<div style="padding:8px 0;border-bottom:1px solid var(--line);">
          <div style="display:flex;justify-content:space-between;"><div style="font-weight:600;font-size:13px;">${l.loaiNghi}</div>
          <span class="pill" style="background:${l.trangThai === "DaDuyet" ? "#E7F8F0" : l.trangThai === "TuChoi" ? "#FBEAEA" : "#FDF3E4"};color:${l.trangThai === "DaDuyet" ? "var(--green)" : l.trangThai === "TuChoi" ? "var(--red)" : "var(--amber)"};">
            ${l.trangThai === "DaDuyet" ? "Đã duyệt" : l.trangThai === "TuChoi" ? "Từ chối" : "Chờ duyệt"}</span></div>
          <div class="sub">${l.tuNgay} → ${l.denNgay}</div>
        </div>`).join("")}
    </div>

    <div class="card">
      <div style="font-weight:700;margin-bottom:10px;">Đề nghị sửa công của tôi</div>
      ${myCorrections.length === 0 ? `<div class="empty">Chưa có đề nghị nào.</div>` :
        myCorrections.slice(0, 5).map((c) => `<div style="padding:8px 0;border-bottom:1px solid var(--line);">
          <div style="display:flex;justify-content:space-between;"><div style="font-weight:600;font-size:13px;">Ngày ${c.ngayCanSua}</div>
          <span class="pill" style="background:${c.trangThai === "DaDuyet" ? "#E7F8F0" : c.trangThai === "TuChoi" ? "#FBEAEA" : "#FDF3E4"};color:${c.trangThai === "DaDuyet" ? "var(--green)" : c.trangThai === "TuChoi" ? "var(--red)" : "var(--amber)"};">
            ${c.trangThai === "DaDuyet" ? "Đã duyệt" : c.trangThai === "TuChoi" ? "Từ chối" : "Chờ duyệt"}</span></div>
          <div class="sub">Đề xuất: ${c.gioVaoDeXuat || "—"} → ${c.gioRaDeXuat || "—"}</div>
        </div>`).join("")}
    </div>

    ${admin ? `
    <!-- ===== QUẢN TRỊ HỆ THỐNG (chỉ Admin) ===== -->
    <div class="settings-section-label">Quản trị hệ thống</div>
    <div class="card">
      <div style="font-weight:700;margin-bottom:10px;">Sửa dữ liệu trực tiếp trên hệ thống</div>
      <div class="sub">Bạn có thể sửa tay trong các bảng dữ liệu <b>CC_NHANVIEN</b>, <b>CC_CHAMCONG</b>, <b>CC_NGHIPHEP</b>, <b>CC_CAUHINH</b> trên hệ thống dữ liệu trung tâm — thay đổi sẽ tự động có hiệu lực trong app (trong vòng 20-30 giây, hoặc bấm "Đồng bộ ngay" bên dưới để thấy ngay lập tức). Không cần thao tác gì thêm.</div>
    </div>

    <div class="card">
      <div style="font-weight:700;margin-bottom:10px;">Cấu hình giờ làm</div>
      <label class="sub" style="display:block;margin-bottom:4px;">Giờ vào chuẩn</label>
      ${renderCustomTime("cf_gv", state.config.gioChuan)}
      <label class="sub" style="display:block;margin-bottom:4px;">Giờ ra chuẩn</label>
      ${renderCustomTime("cf_gr", state.config.gioRaChuan)}
      <label class="sub" style="display:block;margin-bottom:4px;">Số phút cho phép trễ</label>
      <input class="input" id="cf_tre" type="text" inputmode="numeric" value="${state.config.soPhutChoPhepTre}" readonly onfocus="this.removeAttribute('readonly');" autocomplete="off" name="cf_tre_field" />
      <label style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
        <input type="checkbox" id="cf_gps" ${state.config.batBuocGPS ? "checked" : ""} /> Bắt buộc chấm công trong bán kính công ty
      </label>
      <label class="sub" style="display:block;margin-bottom:4px;">Bán kính cho phép (mét)</label>
      <input class="input" id="cf_bk" type="text" inputmode="numeric" value="${state.config.banKinhGPS}" readonly onfocus="this.removeAttribute('readonly');" autocomplete="off" name="cf_bk_field" />
      <div class="sub" style="margin:-4px 0 10px;">GPS điện thoại luôn có sai số tự nhiên (thường 10-50m, có lúc hơn trong nhà/nhiều tầng). Nên đặt tối thiểu 50-100m để tránh chặn nhầm nhân viên đứng đúng vị trí.</div>
      <button class="btn btn-outline" id="cf_setloc" style="margin-bottom:8px;">Lấy vị trí hiện tại làm vị trí công ty</button>
      <div class="sub" id="cf_locinfo" style="margin-bottom:10px;">${state.config.viTriCongTy.lat ? `Đã đặt: ${state.config.viTriCongTy.lat.toFixed(6)}, ${state.config.viTriCongTy.lng.toFixed(6)}` : "Chưa đặt vị trí công ty"}</div>
      <button class="btn btn-primary" id="btnSaveConfig">Lưu cấu hình</button>
    </div>` : ""}

    <!-- ===== ỨNG DỤNG ===== -->
    <div class="settings-section-label">Ứng dụng</div>
    ${admin ? `
    <div class="card">
      <div style="font-weight:700;margin-bottom:10px;">Đồng bộ dữ liệu</div>
      <div class="sub" style="margin-bottom:10px;">Dữ liệu tự động đồng bộ sau mỗi thay đổi. Bấm nút bên dưới để đồng bộ ngay.</div>
      <button class="btn btn-outline" id="btnSyncNow">Đồng bộ ngay</button>
    </div>

    <div class="card">
      <div style="font-weight:700;margin-bottom:10px;">Làm mới bộ nhớ trên máy</div>
      <div class="sub" style="margin-bottom:10px;">
        Dùng khi dữ liệu trên máy này có vẻ SAI LỆCH so với hệ thống dữ liệu trung tâm (VD: vừa xoá thẳng dòng trên hệ thống mà app vẫn hiện lại).
        Thao tác này xoá dữ liệu tạm trên máy và tải lại đúng y hệt từ hệ thống.
        <span style="color:var(--red);">Lưu ý: nếu bạn vừa thao tác gì đó (chấm công...) mà CHƯA kịp đồng bộ (đang offline), thay đổi đó sẽ mất.</span>
      </div>
      <button class="btn btn-outline" id="btnResetCache">Xoá bộ nhớ đệm & tải lại từ hệ thống</button>
    </div>` : ""}

    <div class="card">
      <div style="font-weight:700;margin-bottom:10px;">Phiên bản ứng dụng</div>
      <div class="sub" style="margin-bottom:10px;">Đang dùng bản: ${APP_VERSION}</div>
      <button class="btn btn-outline" id="btnCheckUpdate">Kiểm tra cập nhật</button>
    </div>

    <!-- ===== ĐĂNG XUẤT - LUÔN Ở CUỐI CÙNG, TÁCH RIÊNG, TỰ THÀNH 1 KHỐI ===== -->
    <div style="height:8px;"></div>
    <div class="card" style="padding:6px;">
      <button class="btn btn-red" id="btnLogout" style="background:transparent;font-weight:700;">Đăng xuất</button>
    </div>
    <div class="sub" style="text-align:center;margin-top:14px;">Era Chấm Công · Phiên bản ${APP_VERSION}</div>
  </div>`;
}
function bindSettingsEvents(u) {
  const logoutBtn = document.getElementById("btnLogout");
  if (logoutBtn) logoutBtn.onclick = doLogout;
  const syncBtn = document.getElementById("btnSyncNow");
  if (syncBtn) syncBtn.onclick = async () => { toast("Đang đồng bộ..."); await syncPush(); await syncPull(true); toast("Đã đồng bộ xong."); };
  const resetBtn = document.getElementById("btnResetCache");
  if (resetBtn) resetBtn.onclick = () => resetLocalCacheAndReload();
  const updateBtn = document.getElementById("btnCheckUpdate");
  if (updateBtn) updateBtn.onclick = async () => {
    toast("Đang kiểm tra...");
    const has = await checkForUpdate(false);
    if (has) applyUpdate();
  };

  if (document.getElementById("cf_gv_h_btn")) {
    bindCustomTime("cf_gv");
    bindCustomTime("cf_gr");
  }

  const setLocBtn = document.getElementById("cf_setloc");
  if (setLocBtn) setLocBtn.onclick = async () => {
    document.getElementById("cf_locinfo").textContent = "Đang xác định vị trí (đợi vài giây để có độ chính xác cao)...";
    const loc = await getLocation();
    if (!loc) { toast("Không lấy được vị trí. Kiểm tra quyền định vị."); document.getElementById("cf_locinfo").textContent = state.config.viTriCongTy.lat ? `Đã đặt: ${state.config.viTriCongTy.lat.toFixed(6)}, ${state.config.viTriCongTy.lng.toFixed(6)}` : "Chưa đặt vị trí công ty"; return; }
    state.config.viTriCongTy = { lat: loc.lat, lng: loc.lng };
    const accTxt = loc.accuracy ? ` (độ chính xác ~${Math.round(loc.accuracy)}m)` : "";
    document.getElementById("cf_locinfo").textContent = `Đã đặt: ${loc.lat.toFixed(6)}, ${loc.lng.toFixed(6)}${accTxt}`;
    toast("Đã lấy vị trí hiện tại. Nhớ bấm Lưu cấu hình để áp dụng.");
  };
  const gpsCheckbox = document.getElementById("cf_gps");
  if (gpsCheckbox) gpsCheckbox.onchange = () => {
    if (gpsCheckbox.checked && (!state.config.viTriCongTy || state.config.viTriCongTy.lat == null)) {
      toast("Cần đặt vị trí công ty trước khi bật bắt buộc GPS.");
      gpsCheckbox.checked = false;
    }
  };
  const saveCfg = document.getElementById("btnSaveConfig");
  if (saveCfg) saveCfg.onclick = () => {
    if (document.getElementById("cf_gps").checked && (!state.config.viTriCongTy || state.config.viTriCongTy.lat == null)) {
      toast("Cần đặt vị trí công ty (bấm nút bên trên) trước khi bật bắt buộc GPS.");
      return;
    }
    state.config = {
      gioChuan: getCustomTimeValue("cf_gv"),
      gioRaChuan: getCustomTimeValue("cf_gr"),
      soPhutChoPhepTre: Number(document.getElementById("cf_tre").value) || 0,
      batBuocGPS: document.getElementById("cf_gps").checked,
      banKinhGPS: Number(document.getElementById("cf_bk").value) || 300,
      viTriCongTy: state.config.viTriCongTy,
      updatedAt: nowMs(),
    };
    saveLocal(); scheduleSync();
    toast("Đã lưu cấu hình.");
  };
}

// =====================================================================
// GẮN SỰ KIỆN THEO TAB
// =====================================================================
function bindScreenEvents(tab, u) {
  if (tab === "checkin") bindScreenEventsCheckin(u);
  if (tab === "employees") bindEmployeesEvents(u);
  if (tab === "history") bindHistoryEvents(u);
  if (tab === "report") bindReportEvents(u);
  if (tab === "settings") bindSettingsEvents(u);
}

// =====================================================================
// KIỂM TRA CẬP NHẬT PHIÊN BẢN MỚI
// =====================================================================
let updateAvailable = false;

async function checkForUpdate(silent) {
  try {
    const res = await fetch(window.location.pathname + "?_check=" + Date.now(), { cache: "no-store" });
    const html = await res.text();
    const match = html.match(/const APP_VERSION = "([^"]+)"/);
    if (match && match[1] !== APP_VERSION) {
      updateAvailable = true;
      // Kiểm tra ngầm (tự động) phát hiện bản mới -> tự áp dụng luôn, KHÔNG cần bấm,
      // NHƯNG chỉ khi không có popup/form nào đang mở (tránh mất dữ liệu đang gõ dở).
      // Nếu đang có form mở, hiện banner để người dùng tự bấm khi tiện.
      if (silent && !isOverlayOpen()) {
        applyUpdate();
      } else {
        showUpdateBanner();
      }
      return true;
    }
    if (!silent) toast("Bạn đang dùng bản mới nhất.");
    return false;
  } catch (e) {
    if (!silent) toast("Không kiểm tra được cập nhật (kiểm tra kết nối mạng).");
    return false;
  }
}

function showUpdateBanner() {
  if (document.getElementById("updateBanner")) return;
  const el = document.createElement("div");
  el.id = "updateBanner";
  el.style.cssText = "position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;" +
    "background:var(--amber);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;" +
    "text-align:center;font-size:13px;font-weight:600;z-index:300;cursor:pointer;";
  el.textContent = "Có bản cập nhật mới — Bấm để cập nhật ngay";
  el.onclick = applyUpdate;
  document.body.appendChild(el);
}

function applyUpdate() {
  window.location.href = window.location.pathname + "?v=" + Date.now();
}

// =====================================================================
// KHỞI ĐỘNG
// =====================================================================
async function bootstrap() {
  if (activeEmployees().length === 0) {
    try {
      const res = await apiCall("GET", { action: "checkInit" });
      serverHasEmployees = res.success ? res.initialized : false;
    } catch (e) {
      serverHasEmployees = null; // không có mạng - chưa xác định được, ưu tiên hiện Đăng nhập thay vì Thiết lập
    }
  }
  renderApp();
  if (session) {
    syncPull(true);
    setInterval(() => syncPull(true), 30000);
  }
  setTimeout(() => checkForUpdate(true), 3000);
  setInterval(() => checkForUpdate(true), 5 * 60 * 1000);
}
bootstrap();

// =====================================================================
// CHẶN NÚT BACK CỨNG CỦA ĐIỆN THOẠI - không cho trình duyệt tự xử lý
// (vốn sẽ "lùi trang" hoặc thoát app đột ngột). Thay vào đó, nút Back sẽ:
// 1. Đang mở popup/form nào đó -> đóng lại
// 2. Đang không ở tab Chấm công -> quay về tab Chấm công
// 3. Đã ở tab Chấm công, không có gì mở -> hỏi "Bấm lần nữa để thoát"
// =====================================================================
function isOverlayOpen() {
  const el = document.getElementById("overlay");
  return !!(el && el.classList.contains("show"));
}

try {
  history.pushState({ appGuard: true }, "");
  window.addEventListener("popstate", () => {
    if (isOverlayOpen()) {
      closeSheet();
      history.pushState({ appGuard: true }, "");
      return;
    }
    if (session && currentTab !== "checkin") {
      currentTab = "checkin";
      renderApp();
      history.pushState({ appGuard: true }, "");
      return;
    }
    const now = Date.now();
    if (window._lastBackPress && now - window._lastBackPress < 2000) {
      return; // bấm lần 2 trong 2 giây -> để trình duyệt/hệ thống thoát app thật
    }
    window._lastBackPress = now;
    toast("Nhấn Back lần nữa để thoát ứng dụng.");
    history.pushState({ appGuard: true }, "");
  });
} catch (e) {
  // trình duyệt không hỗ trợ History API đầy đủ - bỏ qua, không chặn được cũng không lỗi
}
</script>
</body>
</html>
